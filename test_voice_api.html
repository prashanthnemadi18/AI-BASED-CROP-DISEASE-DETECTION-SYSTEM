<!DOCTYPE html>
<html>
<head>
    <title>Test Voice API</title>
</head>
<body>
    <h1>Testing Voice API Endpoint</h1>
    <button onclick="testWakeWord()">Test Wake Word API</button>
    <button onclick="testProcess()">Test Process API</button>
    <pre id="output"></pre>

    <script>
        const API_URL = 'http://localhost:5000';
        const output = document.getElementById('output');

        async function testWakeWord() {
            output.textContent = 'Testing wake word endpoint...\\n';
            try {
                const response = await fetch(`${API_URL}/api/voice/wake-word-response`);
                const data = await response.json();
                output.textContent += 'SUCCESS!\\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent += 'ERROR: ' + error.message;
            }
        }

        async function testProcess() {
            output.textContent = 'Testing process endpoint...\\n';
            try {
                const response = await fetch(`${API_URL}/api/voice/process`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: 'Hello, what is tomato blight?',
                        context: {}
                    })
                });
                const data = await response.json();
                output.textContent += 'SUCCESS!\\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent += 'ERROR: ' + error.message;
            }
        }
    </script>
</body>
</html>
