services:
  - type: web
    name: agroguard-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: FLASK_DEBUG
        value: 0
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: agroguard_db
      - key: PLANT_CONFIDENCE_THRESHOLD
        value: 0.50
      - key: DISEASE_CONFIDENCE_THRESHOLD
        value: 0.50
